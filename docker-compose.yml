services:
  heresy-server:
    build:
      context: .
      dockerfile: heresy-server/Dockerfile
    image: ghcr.io/vemeth/heresy-rising-server:latest
    environment:
      - NODE_ENV=production
      - SERVER_PORT=${SERVER_PORT:-4100}
      - PORT=${SERVER_PORT:-4100}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me-before-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8281}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - GAME_DB_PATH=/usr/src/app/data/heresy-rising.db
      - BOT_MANAGER_URL=http://heresy-bot-manager:7878
      - BOT_API_KEY=${BOT_API_KEY:-change-me-bot-api}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change-me-admin-api}
      - SIM_BYPASS_TOKEN=${SIM_BYPASS_TOKEN:-change-me-sim}
      - MAX_BOTS_PER_GAME=${MAX_BOTS_PER_GAME:-4}
      - HERESY_SIM_URL=http://heresy-sim:7879
      - SIM_MAX_GAMES_HOST=${SIM_MAX_GAMES_HOST:-100}
      - SIM_MAX_GAMES_ADMIN=${SIM_MAX_GAMES_ADMIN:-500}
      - SIM_HOST_COOLDOWN_MS=${SIM_HOST_COOLDOWN_MS:-60000}
      - SIM_FETCH_TIMEOUT_MS=${SIM_FETCH_TIMEOUT_MS:-30000}
    ports:
      - "${SERVER_HOST_BIND:-127.0.0.1}:${SERVER_PORT:-4100}:${SERVER_PORT:-4100}"
    volumes:
      - ./data:/usr/src/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SERVER_PORT:-4100}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  heresy-bot-manager:
    build:
      context: .
      dockerfile: bot-manager/Dockerfile
    image: ghcr.io/vemeth/heresy-bot-manager:latest
    environment:
      - NODE_ENV=production
      - HERESY_GAME_HOST=http://heresy-server:4100
      - HERESY_BOT_PORT=7878
      - BOT_API_KEY=${BOT_API_KEY:-change-me-bot-api}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change-me-admin-api}
      - SIM_BYPASS_TOKEN=${SIM_BYPASS_TOKEN:-change-me-sim}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen/qwen3-14b}
      - MAX_BOT_SESSIONS=${MAX_BOT_SESSIONS:-12}
      - MAX_BOTS_PER_GAME=${MAX_BOTS_PER_GAME:-4}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-120000}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - MAX_TOKENS=${MAX_TOKENS:-350}
      - MAX_TOKENS_PER_GAME=${MAX_TOKENS_PER_GAME:-200000}
      - LLM_NO_THINK=${LLM_NO_THINK:-true}
      - LLM_STRUCTURED_OUTPUT=${LLM_STRUCTURED_OUTPUT:-true}
      - BOT_ACTION_DELAY_MS=${BOT_ACTION_DELAY_MS:-5000}
      - DIRECTOR_TICK_MS=${DIRECTOR_TICK_MS:-4000}
      - BOT_MIN_CHAT_GAP_MS=${BOT_MIN_CHAT_GAP_MS:-25000}
      - BOT_CHAT_PER_PHASE_MAX=${BOT_CHAT_PER_PHASE_MAX:-3}
      - BOT_INTRO_GAP_MS=${BOT_INTRO_GAP_MS:-12000}
      - BOT_REACTIVE_THRESHOLD=${BOT_REACTIVE_THRESHOLD:-1.0}
      - BOT_FACTION_CHAT=${BOT_FACTION_CHAT:-false}
    volumes:
      - ./data:/usr/src/app/data
    # LM Studio must run with "Serve on Local Network" enabled (binds
    # 0.0.0.0) for this container to reach it via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - heresy-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7878/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  heresy-sim:
    build:
      context: .
      dockerfile: heresy-sim/Dockerfile
    image: ghcr.io/vemeth/heresy-sim:latest
    environment:
      - NODE_ENV=production
      - SIM_PORT=7879
      - SIM_BYPASS_TOKEN=${SIM_BYPASS_TOKEN:-change-me-sim}
      - SIM_HARD_MAX_GAMES=${SIM_HARD_MAX_GAMES:-1000}
      - SIM_MAX_WORKERS=${SIM_MAX_WORKERS:-2}
    ports:
      - "${SIM_HOST_BIND:-127.0.0.1}:${SIM_PORT:-7879}:${SIM_PORT:-7879}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7879/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  heresy-client:
    build:
      context: .
      dockerfile: heresy-client/Dockerfile
    image: ghcr.io/vemeth/heresy-rising-client:latest
    environment:
      - SERVER_PORT=${SERVER_PORT:-4100}
    depends_on:
      - heresy-server
    ports:
      - "${CLIENT_PORT:-8281}:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

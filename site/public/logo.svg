<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- HERESY RISING — brand mark. The H-in-diamond rune, gilt on void.
       Standalone: no fonts, no external refs. Safe as <img>, inline, or mask. -->
  <defs>
    <linearGradient id="hr-gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d6a3f"/>
      <stop offset=".42" stop-color="#c9a961"/>
      <stop offset=".58" stop-color="#f0dcaa"/>
      <stop offset=".74" stop-color="#c9a961"/>
      <stop offset="1" stop-color="#8a7444"/>
    </linearGradient>
    <linearGradient id="hr-gilt-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d195"/>
      <stop offset=".5" stop-color="#c9a961"/>
      <stop offset="1" stop-color="#93794a"/>
    </linearGradient>
  </defs>

  <!-- outer diamond -->
  <path d="M60 6 114 60 60 114 6 60Z" fill="none" stroke="url(#hr-gilt)" stroke-width="3.4"/>

  <!-- spearpoint tips -->
  <path d="M60 0l5 8-5 8-5-8z M120 60l-8 5-8-5 8-5z M60 120l-5-8 5-8 5 8z M0 60l8-5 8 5-8 5z" fill="url(#hr-gilt-v)"/>

  <!-- inner hairline diamond -->
  <path d="M60 18 102 60 60 102 18 60Z" fill="none" stroke="#c9a961" stroke-opacity=".45" stroke-width="1"/>

  <!-- the H — monoline stems with serif caps, crossbar broken by the stud -->
  <g stroke="url(#hr-gilt-v)" fill="none" stroke-linecap="round">
    <path d="M47 37v46M73 37v46" stroke-width="4.4"/>
    <path d="M41.5 37h11M67.5 37h11M41.5 83h11M67.5 83h11" stroke-width="2.6"/>
    <path d="M47 60h6.5M66.5 60h6.5" stroke-width="3.4"/>
  </g>

  <!-- crossbar stud -->
  <path d="M60 53.5 66 60l-6 6.5L54 60Z" fill="url(#hr-gilt)"/>
  <path d="M60 49.5 69.5 60 60 70.5 50.5 60Z" fill="none" stroke="#c9a961" stroke-opacity=".5" stroke-width="1"/>
</svg>
